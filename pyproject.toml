[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-engine"
version = "0.11.0"
description = "End-to-end credit-risk ML/MLOps portfolio project"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "pyarrow>=16",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4",
  "matplotlib>=3.8",
  "catboost>=1.2",
  "kaggle>=1.6",
  "pytest>=8",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx2>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "ruff==0.16.2",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

