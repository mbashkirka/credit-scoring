services:
  credit-risk-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: credit-risk-engine:v1
    ports:
      - "8000:8000"
    environment:
      CREDIT_RISK_ARTIFACT_DIR: /app/artifacts
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()"
        ]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
