name: credit-risk-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credit-risk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/dev.txt
            requirements/runtime.txt

      - name: Install pinned development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Environment report
        run: python scripts/check_m9_environment.py

      - name: Compile
        run: python -m compileall -q src scripts tests

      - name: Ruff
        run: ruff check src scripts tests

      - name: Unit and API tests
        run: pytest -q

      - name: M11 source release contract
        run: python scripts/validate_m11_release.py

  container-contract:
    name: Container contract
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/dev.txt
            requirements/runtime.txt

      - name: Install pinned CI fixture dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Generate synthetic serving artifacts
        run: |
          python scripts/generate_m9_ci_artifacts.py --output-dir artifacts --force
          python scripts/verify_m9_serving_artifacts.py --load-runtime

      - name: Build serving image
        run: docker build --tag credit-risk-engine:ci .

      - name: Start container
        run: |
          docker run --detach \
            --name credit-risk-api-ci \
            --publish 8000:8000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            credit-risk-engine:ci

      - name: End-to-end container smoke test
        run: python scripts/m9_container_smoke_test.py --base-url http://127.0.0.1:8000

      - name: Verify non-root runtime user
        run: test "$(docker exec credit-risk-api-ci id -u)" = "10001"

      - name: Verify Docker health status
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time

          for _ in range(30):
              raw = subprocess.check_output(
                  ["docker", "inspect", "credit-risk-api-ci", "--format", "{{json .State.Health.Status}}"],
                  text=True,
              ).strip()
              status = json.loads(raw)
              if status == "healthy":
                  print("container health: healthy")
                  break
              if status == "unhealthy":
                  raise SystemExit("container became unhealthy")
              time.sleep(1)
          else:
              raise SystemExit("container did not become healthy")
          PY

      - name: Container logs
        if: always()
        run: docker logs credit-risk-api-ci || true

      - name: Remove container
        if: always()
        run: docker rm --force credit-risk-api-ci || true
